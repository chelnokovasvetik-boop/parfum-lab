<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARFUM LAB</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111111;
    color: white;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 25px 18px 40px;
}

.header {
    text-align: center;
    padding: 25px 0;
}

.header h1 {
    font-size: 30px;
    letter-spacing: 3px;
    margin: 0;
}

.header p {
    color: #aaa;
    margin-top: 10px;
}

.card {
    background: #1d1d20;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 15px;
}

.question {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 15px;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.option {
    background: #29292d;
    color: white;
    border: none;
    border-radius: 14px;
    padding: 15px 10px;
    font-size: 15px;
}

.option.selected {
    background: white;
    color: black;
}

.find {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 17px;
    font-size: 17px;
    font-weight: bold;
    background: white;
    color: black;
    margin-top: 5px;
}

.result {
    background: white;
    color: black;
    border-radius: 20px;
    padding: 22px;
    margin-top: 20px;
}

.result h2 {
    margin-top: 0;
}

.tag {
    display: inline-block;
    background: #eeeeee;
    border-radius: 8px;
    padding: 6px 9px;
    margin: 3px;
    font-size: 13px;
}

.hidden {
    display: none;
}

.footer {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>PARFUM LAB 🌸</h1>
        <p>Найди свой идеальный аромат</p>
    </div>

    <div class="card">
        <div class="question">1. Для кого выбираем?</div>

        <div class="options" id="gender">
            <button class="option">Мужской</button>
            <button class="option">Женский</button>
            <button class="option">Унисекс</button>
            <button class="option">Неважно</button>
        </div>
    </div>

    <div class="card">
        <div class="question">2. Какой бюджет?</div>

        <div class="options" id="budget">
            <button class="option">До 3 000 ₽</button>
            <button class="option">До 5 000 ₽</button>
            <button class="option">До 10 000 ₽</button>
            <button class="option">Неважно</button>
        </div>
    </div>

    <div class="card">
        <div class="question">3. Какой аромат нравится?</div>

        <div class="options" id="style">
            <button class="option">Свежий</button>
            <button class="option">Сладкий</button>
            <button class="option">Древесный</button>
            <button class="option">Пряный</button>
            <button class="option">Цитрусовый</button>
            <button class="option">Кожаный</button>
        </div>
    </div>

    <button class="find" onclick="findPerfume()">
        🌸 Подобрать аромат
    </button>

    <div id="result" class="result hidden"></div>

    <div class="footer">
        PARFUM LAB • подбор ароматов
    </div>

</div>

<script>

let selected = {
    gender: "",
    budget: "",
    style: ""
};

document.querySelectorAll(".options").forEach(function(group) {

    group.addEventListener("click", function(event) {

        if (!event.target.classList.contains("option")) {
            return;
        }

        group.querySelectorAll(".option").forEach(function(button) {
            button.classList.remove("selected");
        });

        event.target.classList.add("selected");

        if (group.id === "gender") {
            selected.gender = event.target.innerText;
        }

        if (group.id === "budget") {
            selected.budget = event.target.innerText;
        }

        if (group.id === "style") {
            selected.style = event.target.innerText;
        }

    });

});


function findPerfume() {

    if (!selected.style) {

        alert("Сначала выбери характер аромата 🌸");
        return;

    }

    let perfume;

    switch (selected.style) {

        case "Свежий":
            perfume = {
                name: "Versace Dylan Blue",
                description: "Свежий и универсальный аромат на каждый день.",
                tags: ["Свежий", "Древесный", "Универсальный"]
            };
            break;

        case "Сладкий":
            perfume = {
                name: "Azzaro The Most Wanted",
                description: "Сладкий и заметный аромат для вечера и свиданий.",
                tags: ["Сладкий", "Пряный", "Вечер"]
            };
            break;

        case "Древесный":
            perfume = {
                name: "Terre d’Hermès",
                description: "Элегантный древесно-цитрусовый аромат.",
                tags: ["Древесный", "Цитрусовый", "Классика"]
            };
            break;

        case "Пряный":
            perfume = {
                name: "Spicebomb",
                description: "Тёплый пряный аромат для прохладной погоды.",
                tags: ["Пряный", "Тёплый", "Вечер"]
            };
            break;

        case "Цитрусовый":
            perfume = {
                name: "Acqua di Giò",
                description: "Лёгкий свежий цитрусовый аромат.",
                tags: ["Цитрусовый", "Свежий", "Лето"]
            };
            break;

        case "Кожаный":
            perfume = {
                name: "Tom Ford Ombre Leather",
                description: "Выразительный кожаный аромат с премиальным характером.",
                tags: ["Кожаный", "Премиум", "Вечер"]
            };
            break;

    }

    let tags = "";

    perfume.tags.forEach(function(tag) {
        tags += '<span class="tag">' + tag + '</span>';
    });

    document.getElementById("result").innerHTML =

        "<h2>✨ Твой аромат</h2>" +

        "<h2>" + perfume.name + "</h2>" +

        "<p>" + perfume.description + "</p>" +

        tags +

        "<p><b>Для кого:</b> " +
        (selected.gender || "Неважно") +
        "</p>" +

        "<p><b>Бюджет:</b> " +
        (selected.budget || "Неважно") +
        "</p>" +

        "<p>💡 Совет: перед покупкой протестируй аромат на коже — на каждом человеке он раскрывается немного по-разному.</p>";

    document.getElementById("result").classList.remove("hidden");

    document.getElementById("result").scrollIntoView({
        behavior: "smooth"
    });

}

</script>

</body>
</html>
