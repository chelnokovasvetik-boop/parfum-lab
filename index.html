<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<script src="https://telegram.org/js/telegram-web-app.js?63"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PARFUM LAB</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 20px 16px 40px;
}

.header {
    text-align: center;
    padding: 20px 0 28px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 3px;
}

.header p {
    color: #999;
    margin-top: 9px;
}

.card {
    background: #1c1c1f;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
}

.question {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 14px;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.option {
    border: 0;
    border-radius: 13px;
    padding: 14px 8px;
    background: #29292d;
    color: white;
    font-size: 14px;
    font-weight: 600;
}

.option.selected {
    background: white;
    color: #111;
}

.find {
    width: 100%;
    border: 0;
    border-radius: 15px;
    padding: 17px;
    background: white;
    color: #111;
    font-size: 17px;
    font-weight: 700;
}

.results {
    margin-top: 22px;
}

.result {
    background: white;
    color: #111;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 13px;
}

.result h2 {
    margin: 0 0 7px;
}

.description {
    color: #555;
    line-height: 1.4;
}

.rating {
    margin-top: 12px;
    line-height: 1.7;
}

.tag {
    display: inline-block;
    background: #eee;
    border-radius: 8px;
    padding: 6px 9px;
    margin: 3px;
    font-size: 12px;
}

.hidden {
    display: none;
}

.reset {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 15px;
    background: #29292d;
    color: white;
    font-size: 15px;
    margin-top: 5px;
}

.footer {
    text-align: center;
    color: #666;
    font-size: 12px;
    margin-top: 25px;
}

</style>
</head>

<body>

<script>

if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}

</script>

<div class="container">

<div class="header">
    <h1>PARFUM LAB 🌸</h1>
    <p>Найди аромат под свой стиль</p>
</div>


<div class="card">

<div class="question">
1. Для кого выбираем?
</div>

<div class="options" id="gender">

<button class="option">Мужской</button>
<button class="option">Женский</button>
<button class="option">Унисекс</button>
<button class="option">Неважно</button>

</div>

</div>


<div class="card">

<div class="question">
2. Какой бюджет?
</div>

<div class="options" id="budget">

<button class="option">До 3 000 ₽</button>
<button class="option">До 5 000 ₽</button>
<button class="option">До 10 000 ₽</button>
<button class="option">10 000+ ₽</button>

</div>

</div>


<div class="card">

<div class="question">
3. Какой характер нравится?
</div>

<div class="options" id="style">

<button class="option">Свежий</button>
<button class="option">Сладкий</button>
<button class="option">Древесный</button>
<button class="option">Цитрусовый</button>
<button class="option">Пряный</button>
<button class="option">Кожаный</button>
<button class="option">Фужерный</button>
<button class="option">Не знаю</button>

</div>

</div>


<div class="card">

<div class="question">
4. Когда будешь носить?
</div>

<div class="options" id="occasion">

<button class="option">Каждый день</button>
<button class="option">Свидание ❤️</button>
<button class="option">Вечеринка 🔥</button>
<button class="option">Работа</button>
<button class="option">Лето ☀️</button>
<button class="option">Зима ❄️</button>

</div>

</div>


<div class="card">

<div class="question">
5. Что важнее всего?
</div>

<div class="options" id="priority">

<button class="option">Стойкость</button>
<button class="option">Шлейф</button>
<button class="option">Комплименты</button>
<button class="option">Универсальность</button>

</div>

</div>


<button class="find" onclick="findPerfume()">
🌸 Подобрать аромат
</button>


<div id="results" class="results hidden"></div>

<button id="reset" class="reset hidden" onclick="resetTest()">
↻ Пройти тест заново
</button>

<div class="footer">
PARFUM LAB • подбор ароматов
</div>

</div>


<script>

let answers = {};

const perfumes = [

{
name: "Dior Sauvage",
gender: ["Мужской"],
style: ["Свежий","Древесный"],
budget: ["До 10 000 ₽","10 000+ ₽"],
occasion: ["Каждый день","Свидание ❤️","Вечеринка 🔥"],
priority: ["Стойкость","Шлейф","Комплименты"],
description: "Свежий, древесный и универсальный мужской аромат.",
longevity: 9,
sillage: 9,
compliments: 9,
universal: 10
},

{
name: "Bleu de Chanel",
gender: ["Мужской","Унисекс"],
style: ["Свежий","Древесный","Цитрусовый"],
budget: ["10 000+ ₽"],
occasion: ["Каждый день","Свидание ❤️","Работа"],
priority: ["Универсальность","Комплименты"],
description: "Элегантный свежий древесный аромат практически на любой случай.",
longevity: 8,
sillage: 8,
compliments: 9,
universal: 10
},

{
name: "YSL Y",
gender: ["Мужской"],
style: ["Свежий","Сладкий","Древесный"],
budget: ["До 10 000 ₽","10 000+ ₽"],
occasion: ["Каждый день","Свидание ❤️","Вечеринка 🔥"],
priority: ["Комплименты","Шлейф","Универсальность"],
description: "Свежий и слегка сладкий современный аромат.",
longevity: 9,
sillage: 9,
compliments: 9,
universal: 9
},

{
name: "Azzaro The Most Wanted",
gender: ["Мужской"],
style: ["Сладкий","Пряный"],
budget: ["До 10 000 ₽","10 000+ ₽"],
occasion: ["Свидание ❤️","Вечеринка 🔥","Зима ❄️"],
priority: ["Комплименты","Шлейф","Стойкость"],
description: "Сладкий, тёплый и заметный аромат для вечера.",
longevity: 10,
sillage: 9,
compliments: 9,
universal: 7
},

{
name: "Acqua di Giò",
gender: ["Мужской","Унисекс"],
style: ["Свежий","Цитрусовый"],
budget: ["До 10 000 ₽","10 000+ ₽"],
occasion: ["Каждый день","Лето ☀️","Работа"],
priority: ["Универсальность"],
description: "Лёгкий свежий цитрусовый аромат для тёплой погоды.",
longevity: 7,
sillage: 7,
compliments: 8,
universal: 9
},

{
name: "Terre d’Hermès",
gender: ["Мужской","Унисекс"],
style: ["Древесный","Цитрусовый"],
budget: ["10 000+ ₽"],
occasion: ["Работа","Каждый день"],
priority: ["Универсальность"],
description: "Элегантный древесно-цитрусовый аромат.",
longevity: 8,
sillage: 7,
compliments: 8,
universal: 9
},

{
name: "Spicebomb",
gender: ["Мужской"],
style: ["Пряный","Сладкий"],
budget: ["До 10 000 ₽","10 000+ ₽"],
occasion: ["Вечеринка 🔥","Свидание ❤️","Зима ❄️"],
priority: ["Шлейф","Стойкость"],
description: "Тёплый пряный аромат для вечера и холодной погоды.",
longevity: 9,
sillage: 9,
compliments: 8,
universal: 7
},

{
name: "Tom Ford Ombre Leather",
gender: ["Унисекс","Мужской"],
style: ["Кожаный"],
budget: ["10 000+ ₽"],
occasion: ["Вечеринка 🔥","Свидание ❤️","Зима ❄️"],
priority: ["Шлейф","Стойкость"],
description: "Насыщенный кожаный аромат с премиальным характером.",
longevity: 10,
sillage: 9,
compliments: 8,
universal: 6
},

{
name: "Prada Luna Rossa Carbon",
gender: ["Мужской"],
style: ["Свежий","Древесный","Фужерный"],
budget: ["До 10 000 ₽","10 000+ ₽"],
occasion: ["Каждый день","Работа","Свидание ❤️"],
priority: ["Универсальность","Комплименты"],
description: "Чистый, свежий и универсальный аромат.",
longevity: 8,
sillage: 8,
compliments: 8,
universal: 9
},

{
name: "Le Male",
gender: ["Мужской"],
style: ["Сладкий","Пряный","Фужерный"],
budget: ["До 5 000 ₽","До 10 000 ₽","10 000+ ₽"],
occasion: ["Свидание ❤️","Вечеринка 🔥","Зима ❄️"],
priority: ["Комплименты","Шлейф"],
description: "Сладкий и узнаваемый аромат с тёплым характером.",
longevity: 9,
sillage: 9,
compliments: 9,
universal: 7

}

];


document.querySelectorAll(".options").forEach(function(group) {

group.addEventListener("click", function(event) {

if (!event.target.classList.contains("option")) {
return;
}

group.querySelectorAll(".option").forEach(function(button) {
button.classList.remove("selected");
});

event.target.classList.add("selected");

answers[group.id] = event.target.innerText;

});

});


function findPerfume() {

if (!answers.style) {
alert("Выбери характер аромата 🌸");
return;
}

let results = perfumes.map(function(perfume) {

let score = 0;

if (
answers.gender === "Неважно" ||
!answers.gender ||
perfume.gender.includes(answers.gender)
) {
score += 3;
}

if (answers.style === "Не знаю") {
score += 1;
} else if (perfume.style.includes(answers.style)) {
score += 5;
}

if (
answers.budget &&
perfume.budget.includes(answers.budget)
) {
score += 3;
}

if (
answers.occasion &&
perfume.occasion.includes(answers.occasion)
) {
score += 3;
}

if (
answers.priority &&
perfume.priority.includes(answers.priority)
) {
score += 3;
}

if (answers.priority === "Стойкость") {
score += perfume.longevity;
}

if (answers.priority === "Шлейф") {
score += perfume.sillage;
}

if (answers.priority === "Комплименты") {
score += perfume.compliments;
}

if (answers.priority === "Универсальность") {
score += perfume.universal;
}

return {
perfume: perfume,
score: score
};

});


results.sort(function(a,b) {
return b.score - a.score;
});


let top = results.slice(0,3);

let html = "<h2>✨ Твои лучшие варианты</h2>";

top.forEach(function(item,index) {

let p = item.perfume;

html += `

<div class="result">

<h2>${index + 1}. ${p.name}</h2>

<p class="description">
${p.description}
</p>

<div class="rating">

💪 Стойкость: ${p.longevity}/10<br>
💨 Шлейф: ${p.sillage}/10<br>
❤️ Комплименты: ${p.compliments}/10<br>
🎯 Универсальность: ${p.universal}/10

</div>

<div>

${p.style.map(function(tag) {
return '<span class="tag">' + tag + '</span>';
}).join("")}

</div>

</div>

`;

});


document.getElementById("results").innerHTML = html;

document.getElementById("results").classList.remove("hidden");

document.getElementById("reset").classList.remove("hidden");

document.getElementById("results").scrollIntoView({
behavior:"smooth"
});

}


function resetTest() {

answers = {};

document.querySelectorAll(".option").forEach(function(button) {
button.classList.remove("selected");
});

document.getElementById("results").classList.add("hidden");

document.getElementById("reset").classList.add("hidden");

window.scrollTo({
top:0,
behavior:"smooth"
});

}

</script>

</body>
</html>
