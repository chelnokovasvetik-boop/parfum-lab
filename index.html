<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>PARFUM LAB</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0d;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.container {
    max-width: 560px;
    margin: auto;
    padding: 18px 14px 40px;
}

.header {
    text-align: center;
    padding: 22px 10px 25px;
}

.logo {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 4px;
}

.subtitle {
    color: #999;
    margin-top: 8px;
    font-size: 14px;
}

.section-title {
    font-size: 22px;
    font-weight: 800;
    margin: 25px 0 15px;
}

.question {
    background: #17171a;
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 13px;
}

.question-title {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 13px;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.option {
    border: 1px solid #2c2c31;
    background: #222226;
    color: white;
    padding: 13px 8px;
    border-radius: 13px;
    font-size: 13px;
    font-weight: 650;
}

.option.selected {
    background: white;
    color: black;
    border-color: white;
}

.find {
    width: 100%;
    border: none;
    background: white;
    color: black;
    border-radius: 15px;
    padding: 17px;
    margin-top: 4px;
    font-size: 16px;
    font-weight: 850;
}

.hidden {
    display: none;
}

/* CARDS */

.perfume-card {
    background: #17171a;
    border: 1px solid #29292d;
    border-radius: 23px;
    overflow: hidden;
    margin-bottom: 18px;
}

.perfume-image {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
    background: #222;
}

.perfume-content {
    padding: 17px;
}

.perfume-name {
    font-size: 21px;
    font-weight: 850;
    margin: 0;
}

.brand {
    color: #aaa;
    font-size: 13px;
    margin-top: 4px;
}

.description {
    color: #c4c4c7;
    line-height: 1.45;
    font-size: 14px;
    margin: 13px 0;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
}

.tag {
    background: #29292d;
    color: #ddd;
    padding: 6px 9px;
    border-radius: 8px;
    font-size: 11px;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 15px;
}

.stat {
    background: #222226;
    border-radius: 11px;
    padding: 9px;
    font-size: 12px;
}

.stat b {
    display: block;
    font-size: 14px;
    margin-top: 3px;
}

.bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.price {
    font-size: 18px;
    font-weight: 850;
}

.buy {
    flex: 1;
    text-align: center;
    text-decoration: none;
    background: white;
    color: black;
    padding: 13px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 14px;
}

.reset {
    width: 100%;
    border: none;
    background: #252529;
    color: white;
    border-radius: 14px;
    padding: 15px;
    margin-top: 5px;
    font-size: 14px;
    font-weight: 700;
}

.footer {
    text-align: center;
    color: #666;
    font-size: 11px;
    margin-top: 30px;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">PARFUM LAB</div>
        <div class="subtitle">
            Подбор парфюмерии под твой стиль
        </div>
    </div>


    <div id="test">

        <div class="question">
            <div class="question-title">
                1. Для кого выбираем?
            </div>

            <div class="options" id="gender">
                <button class="option">Мужской</button>
                <button class="option">Женский</button>
                <button class="option">Унисекс</button>

        </div>


        <div class="question">
            <div class="question-title">
                2. Какой бюджет?
            </div>

            <div class="options" id="budget">
                <button class="option">До 5 000 ₽</button>
                <button class="option">До 10 000 ₽</button>
                <button class="option">До 20 000 ₽</button>
                <button class="option">20 000+ ₽</button>
            </div>
        </div>


        <div class="question">
            <div class="question-title">
                3. Какой аромат нравится?
            </div>

            <div class="options" id="style">
                <button class="option">Свежий</button>
                <button class="option">Сладкий</button>
                <button class="option">Древесный</button>
                <button class="option">Цитрусовый</button>
                <button class="option">Пряный</button>
                <button class="option">Кожаный</button>
            </div>
        </div>


        <div class="question">
            <div class="question-title">
                4. Когда будешь носить?
            </div>

            <div class="options" id="occasion">
                <button class="option">Каждый день</button>
                <button class="option">Свидание ❤️</button>
                <button class="option">Вечеринка 🔥</button>
                <button class="option">Работа</button>
                <button class="option">Лето ☀️</button>
                <button class="option">Зима ❄️</button>
            </div>
        </div>


        <div class="question">
            <div class="question-title">
                5. Что важнее?
            </div>

            <div class="options" id="priority">
                <button class="option">Стойкость</button>
                <button class="option">Шлейф</button>
                <button class="option">Комплименты</button>
                <button class="option">Универсальность</button>
            </div>
        </div>


        <button class="find" onclick="findPerfume()">
            ✨ Подобрать аромат
        </button>

    </div>


    <div id="results" class="hidden">

        <div class="section-title">
            ✨ Подобрано для тебя
        </div>

        <div id="cards"></div>

        <button class="reset" onclick="resetTest()">
            ↻ Пройти подбор заново
        </button>

    </div>


    <div class="footer">
        PARFUM LAB • подбор ароматов
    </div>

</div>

document.querySelectorAll(".options").forEach(function(group) {

    group.addEventListener("click", function(event) {

        if (!event.target.classList.contains("option")) {
            return;
        }

        group.querySelectorAll(".option").forEach(function(button) {
            button.classList.remove("selected");
        });

        event.target.classList.add("selected");

        answers[group.id] = event.target.innerText;

    });

});


function calculateScore(perfume) {

    let score = 0;

    if (
        !answers.gender ||
        answers.gender === "Неважно" ||
        perfume.gender.includes(answers.gender)
    ) {
        score += 5;
    }

    if (
        answers.style &&
        perfume.style.includes(answers.style)
    ) {
        score += 8;
    }

    if (
        answers.occasion &&
        perfume.occasion.includes(answers.occasion)
    ) {
        score += 5;
    }

    if (
        answers.budget &&
        perfume.budget.includes(answers.budget)
    ) {
        score += 4;
    }

    if (answers.priority === "Стойкость") {
        score += perfume.longevity;
    }

    if (answers.priority === "Шлейф") {
        score += perfume.sillage;
    }

    if (answers.priority === "Комплименты") {
        score += perfume.sillage;
    }

    if (answers.priority === "Универсальность") {
        score += 10;
    }

    return score;
}


function findPerfume() {

    if (!answers.style) {
        alert("Выбери характер аромата 🌸");
        return;
    }

    let sorted = perfumes
        .map(function(perfume) {

            return {
                perfume: perfume,
                score: calculateScore(perfume)
            };

        })
        .sort(function(a,b) {
            return b.score - a.score;
        });


    let top = sorted.slice(0, 3);

    let html = "";

    top.forEach(function(item) {

        let p = item.perfume;

        html += createCard(p);

    });


    document.getElementById("cards").innerHTML = html;

    document.getElementById("test").classList.add("hidden");

    document.getElementById("results").classList.remove("hidden");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function createCard(p) {

    return `

    <div class="perfume-card">

        <img
            class="perfume-image"
            src="${p.image}"
            alt="${p.name}"
            onerror="this.style.display='none'"
        >

        <div class="perfume-content">

            <h2 class="perfume-name">
                ${p.name}
            </h2>

            <div class="brand">
                ${p.brand}
            </div>

            <div class="description">
                ${p.description}
            </div>

            <div class="tags">

                ${p.style.map(function(tag) {

                    return `<span class="tag">${tag}</span>`;

                }).join("")}

            </div>

            <div class="stats">

                <div class="stat">
                    💪 Стойкость
                    <b>${p.longevity}/10</b>
                </div>

                <div class="stat">
                    💨 Шлейф
                    <b>${p.sillage}/10</b>
                </div>

            </div>

            <div class="bottom">

                <div class="price">
                    ${p.price}
                </div>

                <a
                    class="buy"
                    href="${p.url}"
                    target="_blank"
                >
                    🛒 Купить
                </a>

            </div>

        </div>

    </div>

    `;

}


function resetTest() {

    answers = {};

    document.querySelectorAll(".option").forEach(function(button) {
        button.classList.remove("selected");
    });

    document.getElementById("cards").innerHTML = "";

    document.getElementById("results").classList.add("hidden");

    document.getElementById("test").classList.remove("hidden");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}
